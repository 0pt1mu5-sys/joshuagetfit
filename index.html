<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532D">
<title>GetFit – fasting, nutrition and fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F1F5F2;--ink:#1F2A26;--mut:#5E6F68;--card:#fff;--line:#DCE5DF;--acc:#14532D;--on:#fff;--lt:#4ADE80;--warn:#B45309}
@media(prefers-color-scheme:dark){:root{--bg:#0F1814;--ink:#E6EFEA;--mut:#8CA399;--card:#18251F;--line:#27392F;--acc:#4ADE80;--on:#06210F;--lt:#4ADE80;--warn:#F59E0B}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
header{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 4px;display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:auto}
h1{font-size:25px;margin:0;font-weight:700;letter-spacing:-.5px}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:0}
main{padding:4px 16px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button{font:inherit;cursor:pointer}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:12px;padding:12px 16px;font-weight:700;width:100%}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 13px}.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
label{font-size:13px;color:var(--mut);display:block}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.full{grid-column:1/-1}
.ring{width:230px;max-width:78%;display:block;margin:0 auto}.trk{fill:none;stroke:var(--line);stroke-width:9}.arc{fill:none;stroke:var(--acc);stroke-width:9;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font-family:inherit;text-anchor:middle}
.bar{height:11px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lt);border-radius:9px;transition:width .4s}.bar.over i{background:var(--warn)}
.big{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.1}
details{border-top:1px solid var(--line);padding:9px 0}details:first-of-type{border-top:0}summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;list-style:none}summary::-webkit-details-marker{display:none}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mut);white-space:nowrap}
details p{margin:8px 0 0;font-size:15px}.warn{border-left:4px solid var(--warn);border-radius:6px;padding:8px 12px;background:var(--bg);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;color:var(--mut);padding:12px 0;font-size:12.5px}nav button.on{color:var(--acc);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.meal{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.x{background:none;border:0;color:var(--mut);font-size:20px;padding:0 6px}
.bub{padding:9px 13px;border-radius:14px;margin:6px 0;max-width:88%;white-space:pre-wrap;font-size:15px}.bub.user{background:var(--acc);color:var(--on);margin-left:auto}.bub.assistant{background:var(--bg);border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%}
:focus-visible{outline:3px solid var(--lt);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>GetFit</h1><div class="row"><span class="mut" id="who"></span><button class="chip" onclick="go('me')">Me</button></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script>
/* ===== CONFIG: paste Supabase values (Project settings > API) ===== */
const CFG={url:'YOUR_SUPABASE_URL',key:'YOUR_SUPABASE_ANON_KEY'};
const live=!CFG.url.startsWith('YOUR');
let sb,user=null;

/* ===== Content ===== */
const PROTOS=[
{id:'12:12',h:12,lvl:'Beginner',desc:'Fast 12 hours, eat within 12. Often just means no late-night snacking.',caut:'Low risk for most healthy adults.'},
{id:'14:10',h:14,lvl:'Beginner',desc:'Fast 14 hours, eat within a 10-hour window, e.g. 8am to 6pm.',caut:'Skip if pregnant, breastfeeding or with a history of disordered eating.'},
{id:'16:8',h:16,lvl:'Popular',desc:'Fast 16 hours, eat within 8. Water, tea and black coffee are fine while fasting. Break the fast with a balanced plate.',caut:'People on diabetes medication need medical guidance first.'},
{id:'18:6',h:18,lvl:'Intermediate',desc:'Fast 18 hours, eat in a 6-hour window, usually two meals. Make them nutrient-dense.',caut:'Stop if faint, shaky or unusually irritable.'},
{id:'20:4',h:20,lvl:'Advanced',desc:'The "Warrior" style: fast 20 hours, eat in 4. Hard to meet protein and nutrient needs.',caut:'Experienced fasters only. Not for anyone underweight or pregnant.'},
{id:'OMAD',h:23,lvl:'Advanced',desc:'One meal a day. Make that meal complete: protein, vegetables, carbs and fats.',caut:'Difficult to eat enough safely in one sitting. Check with a clinician.'},
{id:'5:2',h:24,lvl:'Weekly',desc:'Eat normally 5 days; on 2 non-consecutive days eat about 500 to 600 calories.',caut:'Never on consecutive days. Avoid with diabetes or eating-disorder history.'},
{id:'ADF',h:24,lvl:'Weekly',desc:'Alternate-day fasting: a normal day, then a very low-calorie day (about 500 kcal).',caut:'Demanding. Speak to a professional first.'},
{id:'24h',h:24,lvl:'Advanced',desc:'Eat-Stop-Eat: one full 24-hour fast once or twice a week. Break it with a normal-sized meal.',caut:'Not for people with diabetes, low blood pressure or who are pregnant.'},
{id:'36h',h:36,lvl:'Extended',desc:'A 36-hour fast. Rest, hydrate, add electrolytes, and break the fast lightly.',caut:'Higher risk. Get medical advice first and stop if unwell.'},
{id:'Dawn–dusk',h:14,lvl:'Religious',desc:'Dawn-to-sunset fasting as in Ramadan. Eat slow-release foods and fluids before dawn; break the fast with water and dates, then a balanced meal.',caut:'Those ill, pregnant, travelling or on medication should seek guidance on adjustments.'},
{id:'Custom',h:16,lvl:'Custom',desc:'Set your own fasting hours (1 to 48).',caut:'Fasts over 24 hours need medical advice.'}
];
const STAGES=[[0,'Fed state','Digesting your last meal.'],[4,'Settling','Blood sugar and insulin come down.'],[8,'Switching fuel','Stored glycogen is being used.'],[12,'Fat burning rises','The body leans more on stored fat.'],[18,'Ketones rising','Some feel steady energy; many just feel hungry.'],[24,'Deep fast','Only for experienced fasters. Listen to your body.']];
/* approximate values per serving: [name,kcal,protein,carbs,fat] */
const FOODS=[['Nsima, 1 cup',270,6,58,1],['Chambo (tilapia), grilled 100g',120,21,0,4],['Beans, boiled 1 cup',230,15,40,1],['Rice, cooked 1 cup',205,4,45,0],['Cassava, boiled 100g',160,1,38,0],['Sweet potato, boiled 150g',130,2,30,0],['Groundnut sauce, 3 tbsp',150,6,5,12],['Pumpkin leaves, cooked 1 cup',80,4,6,5],['Mandazi, 1',230,4,30,10],['Boiled egg',78,6,1,5],['Chicken, grilled 100g',165,31,0,4],['Banana',105,1,27,0],['Apple',95,0,25,0],['Oatmeal, 1 cup',150,5,27,3],['Greek yoghurt 170g',100,17,6,1],['Lentils, 1 cup',230,18,40,1],['Avocado, half',120,1,6,11],['Mixed salad',60,2,8,3],['Tea with milk and sugar',60,2,10,2]];
const MET={'Walking':3.5,'Running / jogging':8,'Cycling':7,'Strength':5,'Core':3.5,'HIIT':8,'Yoga / stretching':2.5,'Home workout':4.5};
const PLAN=['Yoga or stretching, 20 min','Brisk walk, 30 min','Strength: squats, push-ups, rows, 3 x 10','Rest or easy walk, 15 min','Cycle or jog, 25 min','Core: plank, dead bug, bridges, 3 rounds','Long walk, 45 min'];
const MEALS=['breakfast','lunch','dinner','snack'];
const TBL=['meals','water_logs','weights','workouts','fasts'];

/* ===== Helpers + data layer (Supabase, or localStorage until configured) ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayStr=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const r1=n=>Math.round(n*10)/10;
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2600)}
const DB={
async list(t,o={}){const c=o.order||'created_at';
 if(live){let q=sb.from(t).select('*');if(o.from)q=q.gte('day',o.from);q=q.order(c,{ascending:!o.desc});if(o.limit)q=q.limit(o.limit);const{data,error}=await q;if(error)throw error;return data||[]}
 let a=LS.get(t,[]);if(o.from)a=a.filter(r=>r.day>=o.from);a.sort((x,y)=>String(x[c]).localeCompare(String(y[c]))*(o.desc?-1:1));return o.limit?a.slice(0,o.limit):a},
async add(t,r){if(live){const{data,error}=await sb.from(t).insert(r).select().single();if(error)throw error;return data}
 r.id=Date.now()*1000+Math.floor(Math.random()*1000);r.created_at=new Date().toISOString();const a=LS.get(t,[]);a.push(r);LS.set(t,a);return r},
async upd(t,id,p){if(live){const{error}=await sb.from(t).update(p).eq('id',id);if(error)throw error}else{const a=LS.get(t,[]);Object.assign(a.find(x=>x.id==id)||{},p);LS.set(t,a)}},
async del(t,id){if(live){const{error}=await sb.from(t).delete().eq('id',id);if(error)throw error}else LS.set(t,LS.get(t,[]).filter(x=>x.id!=id))},
async profile(){if(live){const{data}=await sb.from('profiles').select('*').maybeSingle();return data}return LS.get('profile',null)},
async saveProfile(p){if(live){const{error}=await sb.from('profiles').upsert({...p,user_id:user.id},{onConflict:'user_id'});if(error)throw error}else LS.set('profile',p)}
};

/* ===== State + calculations (done in app code, not by AI) ===== */
const S={tab:'home',sel:'16:8',cust:16,profile:null,fasts:[],active:null,meals:[],water:[],weights:[],work:[],chat:[],day:dayStr(),sending:0};
const TABS=[['home','Home'],['fast','Fast'],['eat','Eat'],['body','Body'],['move','Move'],['coach','Coach']];
const proto=id=>{const p=PROTOS.find(x=>x.id===id)||PROTOS[2];return id==='Custom'?{...p,h:Math.min(48,Math.max(1,S.cust||16))}:p};
const stageAt=h=>[...STAGES].reverse().find(s=>h>=s[0]);
const fmt=ms=>{const t=Math.max(0,Math.floor(ms/1000));return [Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(n=>String(n).padStart(2,'0')).join(':')};
const tgt=()=>S.profile?.target||2000;
const tot=d=>S.meals.filter(m=>m.day===d).reduce((t,m)=>({k:t.k+m.kcal,p:t.p+(+m.protein||0),c:t.c+(+m.carbs||0),f:t.f+(+m.fat||0)}),{k:0,p:0,c:0,f:0});
const wat=d=>S.water.filter(x=>x.day===d).reduce((s,x)=>s+x.ml,0);
const wmap=()=>{const m={};S.weights.forEach(w=>m[w.day]=+w.kg);return Object.entries(m).sort()};
const curW=()=>{const w=wmap();return w.length?w[w.length-1][1]:(S.profile?.weight||null)};
const startW=()=>{const w=wmap();return w.length?w[0][1]:(S.profile?.weight||null)};
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
function weekly(){const d0=dayStr(-6),ms=S.meals.filter(m=>m.day>=d0),days=new Set(ms.map(m=>m.day)),wk=S.work.filter(x=>x.day>=d0);
 return{avg:days.size?Math.round(ms.reduce((a,m)=>a+m.kcal,0)/days.size):0,days:days.size,wo:wk.length,min:wk.reduce((a,x)=>a+x.minutes,0),
 fasts:S.fasts.filter(f=>f.ended_at&&f.started_at.slice(0,10)>=d0&&(new Date(f.ended_at)-new Date(f.started_at))/36e5>=f.goal_hours).length,water:Math.round([0,1,2,3,4,5,6].reduce((a,i)=>a+wat(dayStr(-i)),0)/7)}}

async function load(){
 try{const f=dayStr(-6);
 [S.profile,S.fasts,S.meals,S.water,S.weights,S.work]=await Promise.all([DB.profile(),DB.list('fasts',{order:'started_at',desc:1,limit:14}),DB.list('meals',{from:f}),DB.list('water_logs',{from:f}),DB.list('weights',{from:dayStr(-120),order:'day'}),DB.list('workouts',{from:f})]);
 S.active=S.fasts.find(x=>!x.ended_at)||null}catch(e){toast('Could not load data: '+(e.message||e))}
 render();
}

/* ===== Views ===== */
const bar=(v,m)=>`<div class="bar ${v>m?'over':''}"><i style="width:${clamp(v/m*100,0,100)}%"></i></div>`;
function vHome(){
 const t=tot(S.day),g=tgt(),left=g-t.k,w=curW(),tw=S.profile?.target_weight,sw=startW(),a=S.active,k=weekly(),water=wat(S.day);
 const mv=S.work.filter(x=>x.day===S.day).reduce((s,x)=>s+x.minutes,0),pr=tw&&sw&&sw!==tw&&w?clamp((sw-w)/(sw-tw)*100,0,100):0;
 return `${S.profile?.target?'':`<p class="warn">Set your calorie target in <a href="#" onclick="go('me');return false" style="color:var(--acc)">Me</a>. Using 2000 kcal for now.</p>`}
 <section class="card"><div class="row sp"><div><div class="big">${Math.round(t.k)}</div><span class="mut">of ${g} kcal eaten</span></div><b style="color:${left<0?'var(--warn)':'var(--acc)'}">${left>=0?left+' left':-left+' over'}</b></div>
 <div style="margin:10px 0">${bar(t.k,g)}</div><div class="g3 mut" style="text-align:center"><span>Protein<br><b style="color:var(--ink)">${Math.round(t.p)}g</b></span><span>Carbs<br><b style="color:var(--ink)">${Math.round(t.c)}g</b></span><span>Fat<br><b style="color:var(--ink)">${Math.round(t.f)}g</b></span></div></section>
 <div class="g2"><section class="card" style="margin:0"><h3>Water</h3><div class="big" style="font-size:24px">${water} ml</div><div style="margin:8px 0">${bar(water,2000)}</div><div class="row"><button class="chip" onclick="add('water_logs',{ml:250})">+250</button><button class="chip" onclick="add('water_logs',{ml:500})">+500</button></div></section>
 <section class="card" style="margin:0"><h3>Fasting</h3>${a?`<div class="big" style="font-size:24px">${fmt(Date.now()-new Date(a.started_at)).slice(0,5)}</div><span class="mut">${esc(a.protocol)} in progress</span>`:'<p class="mut" style="margin:4px 0 8px">No active fast</p>'}<button class="chip" onclick="go('fast')">${a?'View':'Start'}</button></section></div>
 <section class="card"><div class="row sp"><h3>Weight</h3><button class="chip" onclick="go('body')">Log</button></div><div class="big" style="font-size:24px">${w?w+' kg':'Not set'}${tw?` <span class="mut" style="font-size:15px">→ ${tw} kg</span>`:''}</div>${tw?`<div style="margin-top:8px">${bar(pr,100)}</div><span class="mut">${Math.round(pr)}% of the way</span>`:''}</section>
 <section class="card"><div class="row sp"><h3>Today's movement</h3><button class="chip" onclick="go('move')">Log</button></div><p style="margin:6px 0">Suggested: ${PLAN[new Date().getDay()]}</p><span class="mut">${mv} min logged today</span></section>
 <section class="card"><h3>Last 7 days</h3><div class="g2 mut" style="margin-top:6px"><span>Avg intake<br><b style="color:var(--ink)">${k.avg||'–'} kcal</b> (${k.days} days logged)</span><span>Workouts<br><b style="color:var(--ink)">${k.wo}</b> (${k.min} min)</span><span>Fasts completed<br><b style="color:var(--ink)">${k.fasts}</b></span><span>Avg water<br><b style="color:var(--ink)">${k.water} ml</b></span></div></section>
 <button class="btn" onclick="go('coach')">Ask the AI coach</button>`;
}
function vFast(){
 const a=S.active,p=proto(a?a.protocol:S.sel);
 const done=S.fasts.filter(f=>f.ended_at).slice(0,6).map(f=>{const h=(new Date(f.ended_at)-new Date(f.started_at))/36e5;
  return `<div class="meal"><span>${esc(f.protocol)} <span class="mut">${new Date(f.started_at).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span></span><span>${h.toFixed(1)}h ${h>=f.goal_hours?'<span style="color:var(--acc)">goal met</span>':'<span class="mut">of '+f.goal_hours+'h</span>'}</span></div>`}).join('');
 return `<section class="card" style="text-align:center">
 <svg viewBox="0 0 120 120" class="ring" aria-label="Fasting progress"><circle class="trk" cx="60" cy="60" r="52"/><circle id="arc" class="arc" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"/>
 <text id="tm" x="60" y="63" font-size="15" font-weight="700">${a?'00:00:00':p.h+'h goal'}</text><text id="st" x="60" y="80" font-size="6.5" style="fill:var(--mut)">${a?'':'Ready when you are'}</text></svg>
 <p id="stdesc" class="mut" style="min-height:44px;margin:10px 0">${a?'':esc(p.desc)}</p>
 ${a?`<div class="row" style="justify-content:center;margin-bottom:12px"><span class="tag">${esc(a.protocol)}</span><span class="tag" id="left"></span></div><button class="btn ghost" onclick="endFast()">End fast</button>`
 :`<div class="chips">${PROTOS.map(x=>`<button class="chip ${x.id===S.sel?'on':''}" onclick="S.sel='${x.id}';render()">${x.id}</button>`).join('')}</div>
 ${S.sel==='Custom'?`<label for="ch" style="text-align:left">Hours (1 to 48)</label><input id="ch" type="number" min="1" max="48" value="${S.cust}" onchange="S.cust=+this.value;render()" style="margin-bottom:10px">`:''}
 <p class="warn" style="text-align:left">${esc(p.caut)}</p><button class="btn" onclick="startFast()">Start ${esc(p.id)} fast</button>`}</section>
 <section class="card"><h2>Recent fasts</h2>${done||'<p class="mut" style="margin:0">Finished fasts appear here.</p>'}</section>
 <section class="card"><h2>Fasting guide</h2>${PROTOS.filter(x=>x.id!=='Custom').map(x=>`<details><summary><h3>${esc(x.id)}</h3><span class="tag">${x.lvl}</span></summary><p>${esc(x.desc)}</p><p class="warn">${esc(x.caut)}</p><p><button class="chip" onclick="S.sel='${x.id}';scrollTo(0,0);render()">Use ${esc(x.id)}</button></p></details>`).join('')}</section>
 <section class="card"><h2>What happens as you fast</h2><p class="mut" style="margin-top:0">A typical pattern; everyone differs.</p>${STAGES.map(s=>`<div class="meal"><span><b>${s[1]}</b><br><span class="mut">${s[2]}</span></span><span class="tag">${s[0]}h+</span></div>`).join('')}</section>
 <section class="card"><p class="warn" style="margin:0">Fasting is optional and not for everyone. Do not fast without medical advice if you are pregnant or breastfeeding, under 18, underweight, diabetic or on regular medication, or have had an eating disorder. Stop and eat if you feel faint or unwell.</p></section>`;
}
function foodList(q=''){q=q.toLowerCase();return FOODS.map((f,i)=>[f,i]).filter(([f])=>f[0].toLowerCase().includes(q)).slice(0,8).map(([f,i])=>`<div class="meal"><span>${f[0]}<br><span class="mut">${f[1]} kcal · P${f[2]} C${f[3]} F${f[4]}</span></span><button class="chip" onclick="addFood(${i})">Add</button></div>`).join('')||'<p class="mut">No match. Use custom entry below.</p>'}
function vEat(){
 const t=tot(S.day),g=tgt(),left=g-t.k,td=S.meals.filter(m=>m.day===S.day);
 return `<section class="card"><div class="row sp"><div><div class="big">${Math.round(t.k)}</div><span class="mut">of ${g} kcal today</span></div><b style="color:${left<0?'var(--warn)':'var(--acc)'}">${left>=0?left+' left':-left+' over'}</b></div>
 <div style="margin:10px 0">${bar(t.k,g)}</div><span class="mut">P ${Math.round(t.p)}g · C ${Math.round(t.c)}g · F ${Math.round(t.f)}g</span></section>
 <section class="card"><h2>Add food</h2><div class="g2"><div><label for="mt">Meal</label><select id="mt">${MEALS.map(m=>`<option>${m}</option>`).join('')}</select></div><div><label for="sv">Servings</label><input id="sv" type="number" step="0.5" min="0.5" value="1"></div>
 <div class="full"><label for="fs">Search foods (includes Malawian staples)</label><input id="fs" placeholder="nsima, chambo, beans..." oninput="$('#fl').innerHTML=foodList(this.value)"></div></div>
 <div id="fl">${foodList()}</div><p class="mut" style="margin-bottom:0">Built-in values are approximate estimates, not lab-verified.</p>
 <details style="margin-top:8px"><summary><b>Custom entry</b></summary><div class="g2" style="margin-top:8px"><div class="full"><label for="mn">Food</label><input id="mn"></div>
 <div><label for="mk">Calories</label><input id="mk" type="number" inputmode="numeric" min="0"></div><div><label for="mp">Protein g</label><input id="mp" type="number" min="0"></div><div><label for="mc">Carbs g</label><input id="mc" type="number" min="0"></div><div><label for="mf">Fat g</label><input id="mf" type="number" min="0"></div></div>
 <button class="btn" style="margin-top:10px" onclick="addCustom()">Add to today</button></details></section>
 <section class="card"><h2>Today's log</h2>${MEALS.map(mt=>{const ms=td.filter(m=>(m.meal_type||'snack')===mt);return ms.length?`<h3 style="margin-top:8px;text-transform:capitalize">${mt}</h3>`+ms.map(m=>`<div class="meal"><span>${esc(m.name)}<br><span class="mut">P ${m.protein||0} · C ${m.carbs||0} · F ${m.fat||0}${m.source==='database'?' · est.':''}</span></span><span><b>${m.kcal}</b><button class="x" aria-label="Delete ${esc(m.name)}" onclick="delRow('meals','${m.id}')">×</button></span></div>`).join(''):''}).join('')||'<p class="mut" style="margin:0">Nothing logged yet.</p>'}</section>
 <section class="card"><h2>Build a healthy plate</h2><p style="margin:0">Half vegetables and fruit, a quarter lean protein (fish, eggs, beans, chicken), a quarter whole grains or starchy roots, plus a little healthy fat. Drink water and go easy on sugary drinks. Break a fast with a balanced meal, eaten slowly.</p></section>`;
}
function chart(pts){if(pts.length<2)return'<p class="mut">Log at least two weigh-ins on different days to see a trend.</p>';
 const ys=pts.map(p=>p[1]),mn=Math.min(...ys)-.5,mx=Math.max(...ys)+.5,X=i=>12+i*296/(pts.length-1),Y=v=>86-(v-mn)/(mx-mn)*74;
 return `<svg viewBox="0 0 320 100" style="width:100%" role="img" aria-label="Weight trend"><polyline fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>X(i)+','+Y(p[1])).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p[1])}" r="3" fill="var(--acc)"/>`).join('')}<text x="2" y="98" font-size="9" fill="var(--mut)">${mn.toFixed(1)} kg</text><text x="318" y="98" font-size="9" text-anchor="end" fill="var(--mut)">${mx.toFixed(1)} kg</text></svg>`;
}
function vBody(){
 const w=curW(),sw=startW(),tw=S.profile?.target_weight,h=S.profile?.height,bmi=w&&h?r1(w/((h/100)**2)):null,pts=wmap();
 return `<section class="card"><h2>Log weight</h2><div class="g2"><div><label for="bw">Weight kg</label><input id="bw" type="number" step="0.1" inputmode="decimal"></div><div><label for="bm">Waist cm (optional)</label><input id="bm" type="number" step="0.5" inputmode="decimal"></div></div><button class="btn" style="margin-top:10px" onclick="addWeight()">Save today's weight</button></section>
 <section class="card"><h2>Trend</h2>${chart(pts)}<div class="g3 mut" style="text-align:center;margin-top:8px"><span>Start<br><b style="color:var(--ink)">${sw??'–'}</b></span><span>Now<br><b style="color:var(--ink)">${w??'–'}</b></span><span>Target<br><b style="color:var(--ink)">${tw??'–'}</b></span></div>
 ${sw&&w?`<p style="margin-bottom:0">Change so far: <b>${r1(w-sw)>0?'+':''}${r1(w-sw)} kg</b>${tw?` · ${r1(Math.abs(w-tw))} kg to target`:''}</p>`:''}
 ${bmi?`<p class="mut" style="margin-bottom:0">BMI ${bmi}. A rough screening number only; it does not measure body fat or overall health.</p>`:''}</section>
 <section class="card"><h2>History</h2>${S.weights.slice().reverse().slice(0,8).map(x=>`<div class="meal"><span>${x.day}${x.waist?` <span class="mut">waist ${x.waist} cm</span>`:''}</span><span><b>${x.kg} kg</b><button class="x" aria-label="Delete entry" onclick="delRow('weights','${x.id}')">×</button></span></div>`).join('')||'<p class="mut" style="margin:0">No entries yet.</p>'}</section>`;
}
function vMove(){
 const wk=S.work.slice().sort((a,b)=>b.day.localeCompare(a.day)||String(b.created_at).localeCompare(String(a.created_at)));
 return `<section class="card"><h2>Today's suggestion</h2><p style="margin:0">${PLAN[new Date().getDay()]}</p><p class="mut" style="margin-bottom:0">A gentle beginner rotation. Warm up first and stop if something hurts.</p></section>
 <section class="card"><h2>Log a workout</h2><div class="g2"><div><label for="wt">Type</label><select id="wt">${Object.keys(MET).map(k=>`<option>${k}</option>`).join('')}</select></div><div><label for="wm">Minutes</label><input id="wm" type="number" min="1" inputmode="numeric"></div>
 <div class="full"><label for="wn">Notes (sets, reps, weights)</label><input id="wn" placeholder="e.g. squats 3x10 at 20kg"></div></div><button class="btn" style="margin-top:10px" onclick="addWorkout()">Save workout</button><p class="mut" style="margin-bottom:0">Calories burned are estimated from the activity type, your weight and duration.</p></section>
 <section class="card"><h2>Last 7 days</h2>${wk.map(x=>`<div class="meal"><span>${esc(x.type)} · ${x.minutes} min<br><span class="mut">${x.day} · ~${x.kcal} kcal${x.notes?' · '+esc(x.notes):''}</span></span><button class="x" aria-label="Delete workout" onclick="delRow('workouts','${x.id}')">×</button></div>`).join('')||'<p class="mut" style="margin:0">No workouts logged yet.</p>'}</section>`;
}
function vCoach(){
 return `<section class="card"><h2>AI health coach</h2><p class="mut" style="margin-top:0">General wellness guidance, not medical advice. ${S.profile?.ai_ok?'Your targets and recent totals are shared to personalise answers.':'Personalisation is off. Turn it on in Me to share your summary.'}</p>
 <div class="chips">${['Plan my meals today','Suggest a workout','Is my progress healthy?','Explain 16:8 fasting'].map(q=>`<button class="chip" onclick="ask('${q}')">${q}</button>`).join('')}</div>
 ${S.chat.map(m=>`<div class="bub ${m.role}">${esc(m.content)}</div>`).join('')}${S.sending?'<div class="bub assistant mut">Thinking…</div>':''}
 <div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="ci" placeholder="Ask anything about food, fasting or training" onkeydown="if(event.key==='Enter')ask()"><button class="btn" style="width:auto" onclick="ask()">Send</button></div></section>`;
}
function vMe(){
 const p=S.profile||{},o=(v,t,c)=>`<option value="${v}" ${String(c)===String(v)?'selected':''}>${t}</option>`;
 return `<section class="card"><h2>Profile and calorie target</h2><div class="g2">
 <div><label for="ps">Sex (for the formula)</label><select id="ps">${o('f','Female',p.sex)}${o('m','Male',p.sex)}</select></div><div><label for="pa">Age</label><input id="pa" type="number" value="${p.age||''}"></div>
 <div><label for="ph">Height cm</label><input id="ph" type="number" value="${p.height||''}"></div><div><label for="pw">Weight kg</label><input id="pw" type="number" step="0.1" value="${p.weight||''}"></div>
 <div><label for="pt">Target weight kg</label><input id="pt" type="number" step="0.1" value="${p.target_weight||''}"></div><div><label for="pv">Activity</label><select id="pv">${o(1.2,'Mostly sitting',p.activity)}${o(1.4,'Light activity',p.activity||1.4)}${o(1.6,'Moderately active',p.activity)}${o(1.8,'Very active',p.activity)}</select></div>
 <div><label for="pg">Goal</label><select id="pg">${o('lose','Lose gently',p.goal)}${o('keep','Maintain',p.goal)}${o('gain','Gain gently',p.goal)}</select></div><div><label for="pd">Diet</label><select id="pd">${['No preference','Vegetarian','Vegan','Halal','Low-carb'].map(x=>o(x,x,p.diet)).join('')}</select></div>
 <div class="full"><label for="pl">Allergies or foods to avoid (comma separated)</label><input id="pl" value="${esc(p.allergies||'')}" placeholder="e.g. groundnuts, shellfish"></div></div>
 <label style="margin:12px 0;display:flex;gap:8px;align-items:center"><input type="checkbox" id="po" style="width:auto" ${p.ai_ok?'checked':''}> Share my targets and recent totals with the AI coach</label>
 <button class="btn" onclick="saveProfile()">Calculate and save</button>
 ${p.target?`<p style="margin-bottom:0">Maintenance ≈ <b>${p.tdee}</b> kcal. Daily target: <b>${p.target}</b> kcal.</p>`:''}
 <p class="mut" style="margin-bottom:0">Mifflin-St Jeor estimate. Targets never drop below ${p.sex==='m'?1500:1200} kcal. For adults 18+; not medical advice.</p></section>
 <section class="card"><h2>Your data</h2><div class="g2"><button class="btn ghost" onclick="exportData()">Export (JSON)</button><button class="btn ghost" onclick="wipe()">Delete my data</button></div></section>
 ${live?`<section class="card"><p class="mut" style="margin-top:0">${esc(user?.email)}</p><button class="btn ghost" onclick="sb.auth.signOut()">Sign out</button></section>`:'<section class="card"><p class="warn" style="margin:0">Supabase is not configured, so data is saved only on this device.</p></section>'}`;
}
function vAuth(){return `<section class="card"><h2>Sign in to sync your data</h2><div class="g2"><div class="full"><label for="ae">Email</label><input id="ae" type="email" autocomplete="email"></div><div class="full"><label for="ap">Password (6+ characters)</label><input id="ap" type="password" autocomplete="current-password"></div></div><div class="g2" style="margin-top:12px"><button class="btn" onclick="auth('in')">Sign in</button><button class="btn ghost" onclick="auth('up')">Create account</button></div></section>`}

/* ===== Actions ===== */
function render(){
 $('#who').textContent=live&&user?user.email.split('@')[0]:'';
 $('#nav').innerHTML=TABS.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 $('#app').innerHTML=live&&!user?vAuth():({home:vHome,fast:vFast,eat:vEat,body:vBody,move:vMove,coach:vCoach,me:vMe}[S.tab])();
 tick();
}
function go(t){S.tab=t;render();scrollTo(0,0)}
async function add(t,r,msg){try{r.day=r.day||S.day;await DB.add(t,r);await load();msg&&toast(msg)}catch(e){toast(e.message)}}
async function delRow(t,id){try{await DB.del(t,id);await load()}catch(e){toast(e.message)}}
async function startFast(){
 if(!S.profile?.fast_ok){if(!confirm('Fasting is optional and not for everyone. Do NOT fast without medical advice if you are pregnant or breastfeeding, under 18, underweight, diabetic or on regular medication, or have had an eating disorder.\n\nDoes none of that apply to you?'))return;
  S.profile={...(S.profile||{}),fast_ok:true};try{await DB.saveProfile(S.profile)}catch(e){toast(e.message);return}}
 try{const p=proto(S.sel);S.active=await DB.add('fasts',{protocol:p.id,goal_hours:p.h,started_at:new Date().toISOString(),ended_at:null});await load()}catch(e){toast(e.message)}
}
async function endFast(){if(!confirm('End this fast now?'))return;try{await DB.upd('fasts',S.active.id,{ended_at:new Date().toISOString()});await load();toast('Fast saved')}catch(e){toast(e.message)}}
function pushMeal(m){const al=(S.profile?.allergies||'').toLowerCase().split(/[,;]/).map(s=>s.trim()).filter(Boolean);
 if(al.some(a=>m.name.toLowerCase().includes(a))&&!confirm('This may match something you avoid ('+al.join(', ')+'). Add anyway?'))return;
 m.meal_type=$('#mt').value;add('meals',m)}
function addFood(i){const f=FOODS[i],s=+$('#sv').value||1;pushMeal({name:f[0]+(s!==1?' ×'+s:''),kcal:Math.round(f[1]*s),protein:r1(f[2]*s),carbs:r1(f[3]*s),fat:r1(f[4]*s),source:'database'})}
function addCustom(){const n=$('#mn').value.trim();if(!n||$('#mk').value===''||+$('#mk').value<0)return toast('Enter a food name and calories');
 pushMeal({name:n,kcal:Math.round(+$('#mk').value),protein:+$('#mp').value||0,carbs:+$('#mc').value||0,fat:+$('#mf').value||0,source:'user'})}
function addWeight(){const kg=+$('#bw').value;if(!(kg>20&&kg<400))return toast('Enter a valid weight in kg');add('weights',{kg,waist:+$('#bm').value||null},'Weight saved')}
function addWorkout(){const m=+$('#wm').value,t=$('#wt').value;if(!(m>0))return toast('Enter the minutes');
 add('workouts',{type:t,minutes:Math.round(m),kcal:Math.round(MET[t]*(curW()||70)*m/60),notes:$('#wn').value.trim()},'Workout saved')}
async function saveProfile(){
 const g=i=>$('#'+i).value,p={...S.profile,sex:g('ps'),age:+g('pa'),height:+g('ph'),weight:+g('pw'),target_weight:+g('pt')||null,activity:+g('pv'),goal:g('pg'),diet:g('pd'),allergies:g('pl').trim(),ai_ok:$('#po').checked};
 if(!(p.age>=18))return toast('This calculator is for adults (18+)');
 if(!(p.height>100&&p.weight>25))return toast('Check your height and weight');
 p.tdee=Math.round((10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161))*p.activity);
 let adj={lose:-400,keep:0,gain:300}[p.goal];const bmi=p.weight/((p.height/100)**2);
 if(bmi<18.5&&adj<0){adj=0;toast('BMI is under 18.5, so weight loss is not advised. Set to maintenance.')}
 p.target=Math.max(p.sex==='m'?1500:1200,Math.round((p.tdee+adj)/10)*10);
 try{await DB.saveProfile(p);S.profile=p;render()}catch(e){toast(e.message)}
}
function ctx(){const t=tot(S.day),p=S.profile||{},k=weekly();return `Goal: ${p.goal||'n/a'}; diet: ${p.diet||'n/a'}; allergies: ${p.allergies||'none stated'}; daily target ${tgt()} kcal; eaten today ${Math.round(t.k)} kcal (P${Math.round(t.p)} C${Math.round(t.c)} F${Math.round(t.f)}); weight ${curW()||'n/a'} kg, target ${p.target_weight||'n/a'} kg; fasting now: ${S.active?S.active.protocol:'no'}; last 7 days: avg ${k.avg} kcal, ${k.wo} workouts, ${k.fasts} fasts completed.`}
async function ask(txt){txt=(txt||$('#ci')?.value||'').trim();if(!txt||S.sending)return;S.chat.push({role:'user',content:txt});S.sending=1;render();
 try{if(!live)throw Error('connect Supabase and deploy the coach function first');const tok=(await sb.auth.getSession()).data.session.access_token;
  const r=await fetch('/.netlify/functions/coach',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({messages:S.chat,context:S.profile?.ai_ok?ctx():''})});
  const d=await r.json();S.chat.push({role:'assistant',content:d.reply||d.error||'No reply'})}catch(e){S.chat.push({role:'assistant',content:'Coach unavailable: '+e.message})}
 S.sending=0;render();scrollTo(0,document.body.scrollHeight)}
async function exportData(){const o={profile:S.profile};for(const t of TBL)o[t]=await DB.list(t);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download='getfit-data.json';a.click()}
async function wipe(){if(!confirm('Delete ALL your logged data and profile? This cannot be undone.'))return;
 try{if(live){for(const t of TBL)await sb.from(t).delete().gte('id',0);await sb.from('profiles').delete().eq('user_id',user.id)}else['profile',...TBL].forEach(k=>localStorage.removeItem(k));S.chat=[];await load();toast('Data deleted')}catch(e){toast(e.message)}}
async function auth(m){const email=$('#ae').value.trim(),password=$('#ap').value;
 const{error,data}=m==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
 if(error)return toast(error.message);if(m==='up'&&!data.session)toast('Check your email to confirm your account')}
function tick(){const a=S.active,arc=$('#arc');if(!arc)return;
 if(!a){arc.style.strokeDashoffset=326.7;return}
 const ms=Date.now()-new Date(a.started_at),h=ms/36e5,goal=a.goal_hours,s=stageAt(h);
 arc.style.strokeDashoffset=326.7*(1-Math.min(h/goal,1));$('#tm').textContent=fmt(ms);$('#st').textContent=s[1];$('#stdesc').textContent=s[2];
 $('#left').textContent=h>=goal?'Goal reached 🎉':fmt(goal*36e5-ms)+' to go'}
setInterval(tick,1000);

/* ===== Boot ===== */
if(live){
 sb=supabase.createClient(CFG.url,CFG.key);
 sb.auth.getSession().then(({data})=>{user=data.session?.user||null;user?load():render()});
 sb.auth.onAuthStateChange((ev,s)=>{const u=s?.user||null;if((u&&u.id)!==(user&&user.id)){user=u;if(u)load();else{Object.assign(S,{profile:null,fasts:[],active:null,meals:[],water:[],weights:[],work:[],chat:[]});render()}}});
}else load();
</script>
</body>
</html>
